# ==== Semantic Color Palette ==================================================
semantic:
  light:
    bg:
      primary: *color-white
      subtle: *color-gray-50
      muted: *color-gray-100
      emphasized: *color-gray-200
      inverted: *color-black
      panel: *color-white
      error: *color-red-50
      warning: *color-orange-50
      success: *color-green-50
      info: *color-blue-50
      hint: *color-purple-50
    fg:
      primary: *color-black
      muted: *color-gray-600
      subtle: *color-gray-400
      inverted: *color-gray-50
      error: *color-red-500
      warning: *color-orange-600
      success: *color-green-600
      info: *color-blue-600
      hint: *color-purple-600
    border:
      primary: *color-gray-200
      muted: *color-gray-100
      subtle: *color-gray-50
      emphasized: *color-gray-300
      inverted: *color-gray-800
      error: *color-red-500
      warning: *color-orange-500
      success: *color-green-500
      info: *color-blue-500
      hint: *color-purple-500
    gray:
      contrast: *color-white
      fg: *color-gray-800
      subtle: *color-gray-100
      muted: *color-gray-200
      emphasized: *color-gray-300
      solid: *color-gray-900
      focusRing: *color-gray-400
      border: *color-gray-200
